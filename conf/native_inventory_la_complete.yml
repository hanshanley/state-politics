schema_version: 1
purpose: Actual remaining Louisiana publisher session/type censuses and Rhode Island native-origin negative proof.
collection_authority: None; the separately frozen named LA150 and RI10 increments govern.
state_status:
  LA: complete_publisher_listed_2023_2024_regular_extraordinary_session_type_queries_not_introduced_universe
  RI: blocked_actual_official_bill_status_origin_explicit_robots_disallow_target_census_unknown
scope_limitations:
  LA:
  - All37 offered type queries across six regular/extraordinary sessions are complete returned publisher lists,
    not an introduced universe or source closure.
  - Seven complete accepted2023HB pages are reused with exact original manifest/body/header proof, without new native
    requests.
  - ACT queries list enacted subsets of underlying HB/SB measures; their1304 record observations are not1304 additional
    native identities or original-stage proof.
  - Organizational and veto contexts have literal no-associated-bills notices, not proof of zero introductions or
    zero legislative activity.
  - Four one-result queries redirected to native BillInfo metadata; no linked policy-text, Original, PDF, DOC or
    version body was fetched.
  - Every main result row and its complete following subject/title row are preserved; singleton metadata retains
    its entire source HTML and all fields/links.
  - Anonymous publisher context cookies were retained while ordinary public query page state was reset between types;
    no login/account, robots/WAF bypass, identity change or request-history reset.
  - The initial HR query entered page2 using publisher-carried page state; all three distinct pages are retained
    and verified without re-fetching page2.
  - An empty HSR offset response was retained as a diagnostic, never interpreted as zero activity; the legitimate
    fresh-query response has all five records.
  - All filing/introduction dates, originals, canonical joins, science/model/analytical admission remain uncertified.
  RI:
  - Official archived Bills and Laws page links HTTPS status.rilegislature.gov Bill Status/History.
  - Counted native-origin robots response is HTTP200 with32 complete bytes explicitly Disallow /.
  - State stopped before any substantive status-origin HTTP; no alternate route, different origin, historical endpoint
    or generic Search workaround.
  - Both target-year native censuses remain unknown, not zero.
canonical_session_candidate_aliases:
  LA:
    23RS: '2023'
    231ES: 2023s1
    24RS: '2024'
    241ES: 2024s1
    242ES: 2024s2
    243ES: 2024s3
adapters:
  louisiana_paired_rows:
    record_selector:
    - tag: table
      classes:
      - ResultsListTable
    - tag: tr
    record_suffix_selector:
      tag: tr
    record_suffix_required_selector:
      tag: span
      attrs_contain:
        id: LabelKWordAndSTitle
    identifier_selector:
      tag: a
      attrs_contain:
        id: _HyperLink1
    include_query_context: true
    bill_types:
    - HB
    - SB
    fields:
      all_source_columns:
        tag: td
      all_source_spans:
        tag: span
      current_status:
        tag: span
        attrs_contain:
          id: LabelStatus
      considered_literal:
        tag: span
        attrs_contain:
          id: LabelConsidered
      subject_and_full_title:
        tag: span
        attrs_contain:
          id: LabelKWordAndSTitle
    pagination:
      count_regex: There are (?P<count>\d+) Instruments in this List
      link_selector:
      - tag: span
        attrs_contain:
          id: DataPager1
      - tag: a
        requires:
        - href
      postback:
        current_page_selector:
        - tag: span
          attrs_contain:
            id: DataPager1
        - tag: span
        target_regex: javascript:__doPostBack\('(?P<target>[^']+)',''\)
        implicit_single_page_count_satisfied: true
        query_entry_submit_field: ctl00$ctl00$PageBody$PageContent$btnSearchByInstRange
  louisiana_singleton_metadata:
    record_selector:
      tag: html
    identifier_selector:
      tag: title
    session_selector:
      tag: span
      attrs_contain:
        id: LabelSession
    include_query_context: true
    publisher_record_key_query_parameter: i
    bill_types:
    - HB
    - SB
    fields:
      all_source_cells:
        tag: td
      all_source_spans:
        tag: span
      complete_subject_and_title:
        tag: span
        attrs_contain:
          id: LabelShortTitle
      current_status:
        tag: span
        attrs_contain:
          id: LabelCurrentStatus
      all_source_action_tables:
        tag: table
    pagination: {}
