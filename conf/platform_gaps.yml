# Why a state party has no platform in the corpus.
#
# The automated pipeline can say *that* it found nothing; it cannot say *why*. "No platform
# was collected" covers a party that publishes nothing, a party whose site is broken, and a
# party whose platform is real but sits behind client-side rendering — three findings a reader
# should not have to treat as one. Each entry below is the result of directly probing that
# party's site by hand, and is recorded here rather than in the generated CSV so the
# explanation survives regeneration and can be reviewed and re-checked like any other input.
#
# `finding` is prose shown in the gap report. `cause` is a coarse machine-readable bucket:
#   no_platform_published  - the site is healthy; it simply has no platform document
#   broken_site            - the site is down, suspended, or serving errors
#   client_rendered        - a platform page exists but its text requires a JS runtime
#   summary_only           - the party publishes a short position blurb, not a platform
#   not_confirmed          - candidates were fetched but none read as a platform
#
# `checked` is the UTC date the probe was run, so a stale explanation is visible as stale.

AK:
  R:
    cause: broken_site
    checked: 2026-07-29
    finding: >-
      site is serving an "Account Suspended" page; the party has no live website
