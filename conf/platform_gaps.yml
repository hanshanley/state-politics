# Reviewed source gaps, including legacy absence findings.
#
# July absence claims below remain unverified in the October audit unless newer evidence
# is recorded. No homepage hit, rejected short document or failed request proves absence.
#
# The automated pipeline can say *that* it found nothing; it cannot say *why*. "No platform
# was collected" covers a party that publishes nothing, a party whose site is broken, and a
# party whose platform is real but sits behind client-side rendering — three findings a reader
# should not have to treat as one. Each entry below is the result of directly probing that
# party's site by hand, and is recorded here rather than in the generated CSV so the
# explanation survives regeneration and can be reviewed and re-checked like any other input.
#
# `finding` is prose shown in the gap report. `cause` is a coarse machine-readable bucket:
#   broken_site            - the site is down, suspended, or serving errors
#   client_rendered        - a platform page exists but its text requires a JS runtime
#   summary_only           - the party publishes a short position blurb, not a platform
#   not_confirmed          - source review has not established an operative platform
#
# `checked` is the UTC date the probe was run, so a stale explanation is visible as stale.
# A bounded search cannot establish "no_platform_published"; that legacy bucket is retired.
# Rewording a July observation does not constitute a new source probe or change its date.

AK:
  R:
    cause: not_confirmed
    checked: 2026-10-19
    finding: >-
      the former alaskagop.org host remains suspended, but the retained alaskagop.net
      homepage identifies the Alaska Republican Party and links a substantive seven-section
      page explicitly titled its platform. Its adoption date and operative version are
      unverified; separately retained enduring principles and administrative rules must
      not be conflated with it. The former claim that the party has no live website
      is withdrawn. Retrieval in October does not establish adoption in October.
