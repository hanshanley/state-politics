PA:
  D:
    cause: not_confirmed
    checked: 2026-10-18
    finding: >-
      official May 31, 2025 state-committee minutes report adoption of three resolutions
      and creation of a Platform Committee. Three proposals linked from the official
      Summer 2025 meeting page have been retained separately. Exact adopted text is not
      verified: the minutes' descriptions do not match every linked proposal, one PDF
      includes tracked changes and two proposals fall below the collector's platform
      length cutoff. The retained bylaws describe how a Platform Committee proposes
      whether to adopt a quadrennial platform; this is not evidence of actual adoption.
      A separate 2026 ICE resolution appears in byte-identical February and June uploads,
      but remains a submitted text without verified adoption. The Winter 2026 meeting
      page links Fall 2025 minutes; their download returns an owner-permission error,
      despite HTTP 200. A full operative platform remains unresolved; neither failed
      requests, restricted downloads nor rejected proposals establishes absence.
