schema_version: 1
purpose: Offline complete publisher-listed AR session/type/page census metadata projection
collection_authority: Separate frozen new150-exchange AR authorization; no authority
  here
producer_sha256: 033e874423e982d6b27b7b2cdb3a35db96fe9d152b398630920741d12e2812a4
state_status:
  AR: complete_four_session_publisher_listed_type_page_census_not_introduced_universe
scope_limitations:
  AR:
  - All exact type links and every observed page recovered for2023R,2023S1,2024F,2024S2.
  - Publisher-listed census is not independent proof of all introduced measures.
  - Bill/nonbill, regular/fiscal/extraordinary sessions and2023biennium remain separate.
  - Seven prior complete census pages reused byte-for-byte; no repeated native HTTP.
  - No policy originals downloaded, no canonical join certified and no dates inferred.
  - Prior NH-04 redirect body loss remains disclosed in inherited packet; no NH HTTP.
canonical_session_candidate_aliases:
  AR:
    2023R: '2023'
    2023S1: 2023S1
    2024F: 2024F
    2024S2: 2024S2
adapters:
  role_grid:
    record_selector:
      tag: div
      attrs:
        role: row
      requires:
      - aria-rowindex
    identifier_selector:
      tag: a
      attrs_contain:
        href: /Bills/Detail?
    bill_types:
    - HB
    - SB
    fields:
      title:
        tag: div
        attrs:
          aria-colindex: '2'
      sponsor:
        tag: div
        attrs:
          aria-colindex: '3'
      all_source_cells:
        tag: div
        attrs:
          role: gridcell
    pagination:
      page_regex: Page (?P<page>\d+) of (?P<pages>\d+)
      link_selector:
      - tag: div
        classes:
        - tableSectionFooter
      - tag: a
        requires:
        - href
type_indexes:
