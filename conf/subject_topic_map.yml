# Open States `subject` tags mapped onto the project's CAP-anchored topic scheme.
#
# WHY THIS EXISTS
# ---------------
# Bills are classified from their *titles*, which are short and often procedural. The plank
# classifier was validated against a hand-labelled gold set, but that set is made of platform
# planks, so it says nothing about how well the same model reads a bill title. This file
# supplies an independent check that does not depend on the author's judgement at all: roughly
# half of all bills carry `subject` tags assigned by the legislature's own staff. Comparing the
# model's topic against a tag assigned by a statehouse clerk tests two independent signals
# against each other.
#
# WHAT IS AND IS NOT IN HERE
# --------------------------
# The tag vocabulary is state-specific and enormous -- 88,716 distinct normalised tags, with the
# top 600 covering barely half of all tag instances. It is not mappable in full and no attempt
# is made to. Only tags whose policy area is unambiguous on their own are listed.
#
# Deliberately excluded, because mapping them would invent a judgement the tag does not support:
#   * procedural and housekeeping tags - "subject index", "rules", "reports", "resolutions",
#     "memorials", "recognition", "studies", "boards", "commissions", "sessions"
#   * money tags that say nothing about the policy being funded - "appropriations",
#     "appropriation ($)", "bonds", "fees", "budgeting", "ways and means", "finance"
#   * unit-of-government tags that cut across every topic - "counties", "municipalities",
#     "cities and towns-specific", "local government", "state agencies", "public"
#   * genuinely two-topic tags - "insurance" (health cover vs. an insurance market),
#     "children"/"minors" (welfare vs. family law), "safety", "property", "death"
#   * tags naming a regulated *commodity* or a legal *instrument* rather than a policy area,
#     because bills filed under them span topics: "alcoholic beverages" covers both liquor
#     licensing (commerce) and prohibition (culture); "food" covers farm policy, food safety
#     and food stamps; "licensing" covers every regulated profession; "retirement"/"pensions"
#     covers public-employee schemes and private savings alike
#
# Each entry is one normalised tag (lowercased, whitespace collapsed, any trailing state
# reference code such as "(I0705)" stripped) mapped to a CAP major-topic code from
# `conf/topics.yml`. A tag maps to a topic only where the tag name alone determines it.
#
# This mapping is written from the tag names and the CAP codebook. It is NOT derived from the
# classifier's output, and it does not reuse the keyword seeds in `conf/topics.yml` -- if it
# did, agreement would measure the seeds against themselves rather than testing anything.

